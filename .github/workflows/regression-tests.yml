name: Recovery Baseline Checks

on:
  pull_request:
    branches: [master, feat/attendance-register-generation, feat/attendance-register-submission, feat/attendance-register-administration, feat/attendance-closure-approval]
  push:
    branches: [audit/recovery-test-alignment]

permissions:
  contents: read

jobs:
  recovery-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acadme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acadme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 10
    env:
      DB_TYPE: sqlite
      DB_PATH: .test-database.sqlite
      NODE_ENV: test
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/acadme_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build a fresh disposable SQLite database
        run: node tests/fixtures/prepare-sqlite.js
      - name: Run PostgreSQL section-aware attendance migration test
        run: npm run test:attendance-postgres
      - name: Run SQLite attendance register foundation migration test
        run: npm run test:attendance-register-sqlite
      - name: Run PostgreSQL attendance register foundation migration test
        run: npm run test:attendance-register-postgres
      - name: Run attendance register generation service tests (SQLite)
        run: npm run test:attendance-register-generation
      - name: Run attendance register generation service tests (PostgreSQL)
        run: npm run test:attendance-register-generation-postgres
      - name: Run attendance register save and submission workflow tests (SQLite)
        run: npm run test:attendance-register-workflow
      - name: Run attendance register save and submission workflow tests (PostgreSQL)
        run: npm run test:attendance-register-workflow-postgres
      - name: Run attendance register UI regression checks
        run: npm run test:attendance-register-ui
      - name: Run recovery and schema smoke checks
        run: npm run test:regression
      - name: Run offline cache policy and entry-context tests
        run: node tests/offline-cache-policy.test.js
      - name: Run section-owned academic-records regression tests
        run: npm run test:section-owned
      - name: Run UI shell accessibility regression checks
        run: npm run test:ui-shell
      - name: Run student enrollment UI regression checks
        run: npm run test:student-enrollment-ui
      - name: Run student promotion UI regression checks
        run: node tests/promotion-preview-rendering.test.js
      - name: Remove disposable SQLite database
        if: always()
        run: rm -f .test-database.sqlite .test-database.sqlite-shm .test-database.sqlite-wal