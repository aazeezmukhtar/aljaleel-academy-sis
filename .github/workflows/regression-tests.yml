name: Recovery Baseline Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [audit/recovery-test-alignment]

permissions:
  contents: read

jobs:
  recovery-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static recovery baseline checks
        run: node tests/regression.test.js
