name: Isolated Regression Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [audit/recovery-test-alignment]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_TYPE: sqlite
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression suite against isolated SQLite database
        run: npm run test:regression
